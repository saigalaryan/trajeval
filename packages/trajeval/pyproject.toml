[project]
# PyPI distribution name only — "trajeval" itself was already taken by an
# unrelated package. The import (`import trajeval`) and the CLI command
# (`trajeval ...`) are unaffected; only `pip install <name>` changes.
name = "trajectory-eval"
version = "0.1.0"
description = "Evaluation harness for agentic RAG systems: scores the trajectory, not just the final answer."
readme = "README.md"
license = { text = "MIT" }
# Best-guess display name from the GitHub handle this project is published
# under — edit to your preferred name if this isn't it.
authors = [{ name = "saigalaryan03", email = "saigalaryan03@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "evaluation",
    "agents",
    "rag",
    "llm",
    "retrieval-augmented-generation",
    "agentic",
    "llm-eval",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/saigalaryan03/trajeval"
Repository = "https://github.com/saigalaryan03/trajeval"
Documentation = "https://saigalaryan03.github.io/trajeval/"
"Bug Tracker" = "https://github.com/saigalaryan03/trajeval/issues"
Changelog = "https://github.com/saigalaryan03/trajeval/blob/main/packages/trajeval/CHANGELOG.md"

[project.optional-dependencies]
judge = [
    "anthropic>=0.40",
]
judge-openai = [
    "openai>=1.40",
]
cli = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "anthropic>=0.40",
    "openai>=1.40",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
    "types-PyYAML>=6.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.scripts]
trajeval = "trajeval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trajeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
packages = ["trajeval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer.Option()/typer.Argument() as parameter defaults is the required,
# idiomatic way to declare CLI options in Typer — not the mutable-default
# footgun B008 exists to catch.
"src/trajeval/cli.py" = ["B008"]
