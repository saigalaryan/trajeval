site_name: trajeval
site_description: Evaluation harness for agentic RAG systems — scores the trajectory, not just the answer.
repo_name: trajeval
docs_dir: docs

# No deploy target configured here on purpose — `mkdocs build` is verified
# locally/in CI as a docs-don't-bitrot check, but publishing (GitHub Pages
# or otherwise) is a separate decision this file doesn't make for you.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            show_if_no_docstring: false

markdown_extensions:
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - API reference:
      - Core (run, results, types): api/core.md
      - Metrics: api/metrics.md
      - Judge clients: api/judge.md
      - Calibration: api/calibration.md
      - Configuration: api/config.md
      - Compare, report, serve: api/reporting.md
