site_name: trajeval
site_description: Evaluation harness for agentic RAG systems — scores the trajectory, not just the answer.
site_url: https://saigalaryan03.github.io/trajeval/
repo_name: trajeval
repo_url: https://github.com/saigalaryan03/trajeval
edit_uri: edit/main/packages/trajeval/docs/
docs_dir: docs

# Deployed via .github/workflows/docs.yml (mkdocs gh-deploy, on push to
# main after CI passes) to GitHub Pages. `mkdocs build --strict` in
# ci.yml stays as the correctness check that runs on every PR too — the
# deploy workflow only ever runs from main.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            show_if_no_docstring: false

markdown_extensions:
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - API reference:
      - Core (run, results, types): api/core.md
      - Metrics: api/metrics.md
      - Judge clients: api/judge.md
      - Calibration: api/calibration.md
      - Configuration: api/config.md
      - Compare, report, serve: api/reporting.md
