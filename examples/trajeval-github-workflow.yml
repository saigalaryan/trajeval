name: trajeval evaluation

# This is a TEMPLATE for repos *using* trajeval to evaluate their own agent
# — copy it to `.github/workflows/trajeval.yml` in your own repo (adjusting
# `config`/paths for your setup) and it'll run on every push/PR.
#
# It deliberately does NOT live in this repo's own .github/workflows/ —
# GitHub auto-executes anything placed there, and this repo (trajeval
# itself, the library) has no trajeval.yaml/agent of its own to evaluate.
# A copy of it living in the live workflows/ directory here would fail on
# every single push for that reason alone, which is exactly what happened
# before this file was moved out — see git history if you're curious.
#
# Keeps a baseline RunResult cached from main's last successful run,
# compares every PR against it, and comments the diff. Depends on the
# composite action at .github/actions/trajeval-eval in *this* repo — if
# you're copying this template elsewhere, you'll need that action too (or
# reference it via `saigalaryan/trajeval/.github/actions/trajeval-eval@main`
# instead of the local `./` path below).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Restores the baseline saved by the most recent push to main (see
      # the "Save baseline" step below). A PR from a fresh clone with no
      # prior main-branch run simply misses the cache — that's the
      # no-baseline case the action handles gracefully.
      - name: Restore baseline
        uses: actions/cache/restore@v4
        with:
          path: results/baseline.json
          key: trajeval-baseline-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: trajeval-baseline-

      - uses: ./.github/actions/trajeval-eval
        with:
          config: trajeval.yaml
          baseline-path: results/baseline.json
          out-path: results/candidate.json

      # On main, the candidate this run just produced becomes tomorrow's
      # baseline. Cache path must match the restore step's path exactly, so
      # copy it into place before saving.
      - name: Prepare baseline artifact
        if: github.ref == 'refs/heads/main'
        run: cp results/candidate.json results/baseline.json

      - name: Save baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: results/baseline.json
          key: trajeval-baseline-${{ github.sha }}
